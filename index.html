<script>
(function(){
  'use strict';
  var QUESTION_BANK = JSON.parse(document.getElementById('questionData').textContent);
  var picked = [];
  function shuffle(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;}
    return a;
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function startQuiz(){
    picked=shuffle(QUESTION_BANK).slice(0,50);
    var out='<div class="card"><span class="badge">已抽出 50 題</span><span class="badge">請作答後交卷</span><button type="button" class="ghost" id="rerollTop">重新抽題</button></div>';
    for(var i=0;i<picked.length;i++){
      var q=picked[i];
      out += '<div class="card" id="qcard'+i+'"><div class="qtitle">第 '+(i+1)+' 題（原題號 '+q.num+'）<br>'+esc(q.question)+'</div>';
      for(var c=0;c<q.choices.length;c++){
        out += '<label class="option" id="opt'+i+'_'+(c+1)+'"><input type="radio" name="q'+i+'" value="'+(c+1)+'">('+(c+1)+') '+esc(q.choices[c])+'</label>';
      }
      out += '</div>';
    }
    out += '<div class="fixedbar"><button type="button" class="primary" id="submitBtn">交卷看答案</button><button type="button" class="secondary" id="rerollBottom">重新抽題</button></div><section id="result"></section>';
    document.getElementById('quiz').innerHTML=out;
    document.getElementById('rerollTop').addEventListener('click', startQuiz);
    document.getElementById('rerollBottom').addEventListener('click', startQuiz);
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
    window.scrollTo(0,0);
  }
  function submitQuiz(){
    if(!picked.length) return;
    var correct=0, unanswered=0;
    for(var i=0;i<picked.length;i++){
      var q=picked[i];
      var sel=document.querySelector('input[name="q'+i+'"]:checked');
      var val=sel?parseInt(sel.value,10):0;
      if(!val) unanswered++;
      if(val===q.answer) correct++;
      for(var c=1;c<=q.choices.length;c++){
        var el=document.getElementById('opt'+i+'_'+c);
        if(el){el.className='option'; if(c===q.answer) el.className+=' correct'; if(val===c && val!==q.answer) el.className+=' wrong';}
      }
      var card=document.getElementById('qcard'+i);
      if(card && !card.getAttribute('data-done')){
        var your=val?('你選：('+val+')'):'你未作答';
        card.innerHTML += '<div class="answer">正確答案：('+q.answer+')　'+esc(q.choices[q.answer-1]||'')+'</div><div class="muted">'+esc(your)+'</div>';
        card.setAttribute('data-done','1');
      }
    }
    var score=correct*2, cls=score>=80?'pass':'fail', txt=score>=80?'及格':'未及格';
    var r=document.getElementById('result');
    r.innerHTML='<div class="card"><div class="result '+cls+'">成績：'+score+' 分，'+txt+'</div><p>答對 '+correct+' 題，答錯 '+(50-correct-unanswered)+' 題，未作答 '+unanswered+' 題。</p></div>';
    r.scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.getElementById('startBtn').addEventListener('click', startQuiz);
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
})();
</script>
